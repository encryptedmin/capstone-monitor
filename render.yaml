services:
  - type: web
    name: capstone-monitor
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: capstone-monitor.onrender.com
      - key: DB_NAME
        value: capstone_monitor
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: mysql-3b48df12-digitalfortress20-a405.b.aivencloud.com
      - key: DB_PORT
        sync: false
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem
