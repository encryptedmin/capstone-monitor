services:
  - type: web
    # Match the existing API service's Render hostname so Blueprint syncs
    # its configuration instead of creating a second API service.
    name: capstone-monitor
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free Render services do not have a pre-deploy command, so apply
    # migrations during startup. Create the Aiven database schema first.
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: capstone-monitor.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://capstone-monitor-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://capstone-monitor-frontend.onrender.com/
      - key: DB_NAME
        value: capstone_monitor
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: mysql-3b48df12-digitalfortress20-a405.b.aivencloud.com
      - key: DB_PORT
        sync: false
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem

  - type: web
    name: capstone-monitor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://capstone-monitor.onrender.com/api
